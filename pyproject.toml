[project]
name = "tradematic-research"
version = "0.1.0"
description = "Causal selective classification of 15-minute crypto candles"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5",
  "pyarrow>=18,<24",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
recorder = [
    "kaggle>=1.7,<2",
    "python-dotenv>=1.0,<2",
    "websockets>=15,<16",
    "webull-openapi-python-sdk>=3.0.4,<4",
    "zstandard>=0.23,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["backend/research/tests"]
